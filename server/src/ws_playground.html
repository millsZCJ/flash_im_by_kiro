<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket 测试台 · Flash IM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      overflow: hidden;
    }

    /* 顶部标题栏 */
    .header {
      background: #07C160;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .header .dot.connected { background: #fff; }

    /* 连接状态栏 */
    .status-bar {
      padding: 10px 20px;
      background: #f7f7f7;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
    }
    .status-bar .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      background: #eee;
      color: #888;
    }
    .status-bar .badge.connected { background: #e6f9ee; color: #07C160; }
    .status-bar .badge.error     { background: #fdecea; color: #e53935; }

    /* 消息日志区 */
    .log {
      height: 340px;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fafafa;
    }
    .log-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.5;
    }
    .log-item .time {
      color: #bbb;
      font-size: 11px;
      white-space: nowrap;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .log-item .tag {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tag-recv  { background: #e6f9ee; color: #07C160; }
    .tag-sent  { background: #e8f0fe; color: #1a73e8; }
    .tag-info  { background: #f3f3f3; color: #888; }
    .tag-error { background: #fdecea; color: #e53935; }
    .log-item .text { color: #333; word-break: break-all; }

    /* 空状态 */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 13px;
      gap: 8px;
    }
    .empty svg { opacity: 0.4; }

    /* 输入区 */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #07C160; }
    .input-area input:disabled { background: #f5f5f5; color: #aaa; }

    .btn {
      height: 38px;
      padding: 0 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-send    { background: #07C160; color: #fff; }
    .btn-connect { background: #07C160; color: #fff; }
    .btn-disconnect { background: #f5f5f5; color: #555; }

    /* 底部操作栏 */
    .action-bar {
      padding: 10px 16px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- 标题栏 -->
  <div class="header">
    <div class="dot" id="dot"></div>
    <h1>WebSocket 测试台 · Flash IM</h1>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>端点：ws://127.0.0.1:3000/ws</span>
    <span class="badge" id="badge">未连接</span>
  </div>

  <!-- 消息日志 -->
  <div class="log" id="log">
    <div class="empty" id="empty">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>点击「连接」开始测试</span>
    </div>
  </div>

  <!-- 消息输入 -->
  <div class="input-area">
    <input id="msgInput" type="text" placeholder="输入消息，按 Enter 发送" disabled />
    <button class="btn btn-send" id="sendBtn" disabled onclick="sendMsg()">发送</button>
  </div>

  <!-- 连接操作 -->
  <div class="action-bar">
    <button class="btn btn-connect" id="connectBtn" onclick="connect()">连接</button>
    <button class="btn btn-disconnect" id="disconnectBtn" disabled onclick="disconnect()">断开</button>
  </div>

</div>

<script>
  let ws = null;

  const log      = document.getElementById('log');
  const empty    = document.getElementById('empty');
  const dot      = document.getElementById('dot');
  const badge    = document.getElementById('badge');
  const msgInput = document.getElementById('msgInput');
  const sendBtn  = document.getElementById('sendBtn');
  const connectBtn    = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');

  // 回车发送
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });

  function now() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function addLog(tag, tagClass, text) {
    // 移除空状态提示
    if (empty) empty.style.display = 'none';

    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <span class="time">${now()}</span>
      <span class="tag ${tagClass}">${tag}</span>
      <span class="text">${escapeHtml(text)}</span>
    `;
    log.appendChild(item);
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setConnected(connected) {
    dot.className   = 'dot' + (connected ? ' connected' : '');
    badge.className = 'badge' + (connected ? ' connected' : '');
    badge.textContent = connected ? '已连接' : '未连接';
    msgInput.disabled    = !connected;
    sendBtn.disabled     = !connected;
    connectBtn.disabled  = connected;
    disconnectBtn.disabled = !connected;
    if (connected) msgInput.focus();
  }

  function connect() {
    if (ws) return;

    addLog('INFO', 'tag-info', '正在连接 ws://127.0.0.1:3000/ws ...');
    ws = new WebSocket('ws://127.0.0.1:3000/ws');

    ws.onopen = () => {
      setConnected(true);
      addLog('INFO', 'tag-info', '连接成功');
    };

    ws.onmessage = e => {
      addLog('收到', 'tag-recv', e.data);
    };

    ws.onclose = () => {
      ws = null;
      setConnected(false);
      addLog('INFO', 'tag-info', '连接已断开');
    };

    ws.onerror = () => {
      badge.className  = 'badge error';
      badge.textContent = '连接失败';
      addLog('ERROR', 'tag-error', '连接出错，请确认服务器已启动');
    };
  }

  function disconnect() {
    if (ws) ws.close();
  }

  function sendMsg() {
    const text = msgInput.value.trim();
    if (!text || !ws) return;
    ws.send(text);
    addLog('发送', 'tag-sent', text);
    msgInput.value = '';
  }
</script>
</body>
</html>
