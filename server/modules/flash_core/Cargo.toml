[package]
name = "flash_core"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
axum = { version = "0.7", default-features = false, features = ["http1"] }
